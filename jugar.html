<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon runner</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#080413;--pn:#150b2b;--ln:#2d1c55;--tx:#f2ecff;--mu:#a090cc;--c1:#19f3ff;--c2:#ff2bd6;--c3:#ffd24a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

#app{max-width:480px;height:100%;margin:0 auto;position:relative;display:flex;flex-direction:column}
.scr{display:none;flex:1;min-height:0;flex-direction:column}.scr.on{display:flex}
h1{font:900 30px/1 Orbitron,system-ui,sans-serif;margin:0;color:var(--c1);text-shadow:0 0 12px var(--c1),0 0 30px var(--c2);letter-spacing:1px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
.hud{font:700 14px Orbitron,system-ui,sans-serif;color:var(--c3);text-shadow:0 0 8px var(--c3)}
.tabs{display:flex;gap:6px;padding:8px 16px}
.tabs button{flex:1;padding:10px 0;border:1px solid var(--ln);background:var(--pn);color:var(--mu);border-radius:10px;font-size:15px}
.tabs button.on{color:var(--bg);background:var(--c1);border-color:var(--c1);box-shadow:0 0 14px var(--c1);font-weight:700}
#body{flex:1;overflow-y:auto;padding:8px 16px 20px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:700;color:var(--bg);background:var(--c1);box-shadow:0 0 18px rgba(25,243,255,.55);margin-top:8px}
.btn.m{background:var(--c2);box-shadow:0 0 18px rgba(255,43,214,.55)}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--ln);box-shadow:none}

.mu{color:var(--mu);font-size:14px;margin:2px 0}

.it button.d{background:var(--ln);color:var(--mu)}
.bar{height:8px;background:var(--ln);border-radius:4px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--c1);box-shadow:0 0 8px var(--c1)}
#cv{flex:1;min-height:0;width:100%;display:block;touch-action:none;background:#22094a}#game{position:relative}#hd{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;font:700 18px Orbitron,system-ui,sans-serif;text-shadow:0 0 8px var(--c1);pointer-events:none}#hc{color:var(--c3)}#pw{position:absolute;top:44px;left:14px;font:700 13px Orbitron,system-ui,sans-serif;color:var(--c1);text-shadow:0 0 8px var(--c1);line-height:1.6;pointer-events:none}#bn{position:absolute;top:28%;left:0;right:0;text-align:center;font:900 28px Orbitron,system-ui,sans-serif;color:#fff;text-shadow:0 0 14px var(--c2),0 0 30px var(--c1);opacity:0;transition:opacity .6s;pointer-events:none}#bn.on{opacity:1}#tip{position:absolute;bottom:14%;left:0;right:0;text-align:center;color:var(--mu);font-size:14px;pointer-events:none;transition:opacity .8s}
.ov{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:24px;background:rgba(8,4,19,.92);z-index:5}.ov.on{display:flex}
#adbox{height:150px;border-radius:14px;border:2px dashed var(--c2);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mu);margin-bottom:10px;background:linear-gradient(120deg,#2b0b3f,#0b2a3f)}
#adt{font:900 40px Orbitron,system-ui,sans-serif;color:var(--c3);text-align:center;height:48px}
</style></head><body><div id="app">

<div id="menu" class="scr on">
 <div class="top"><h1>Neon runner</h1><div class="hud" id="hud"></div></div>

</div>

<div id="game" class="scr"><canvas id="cv" width="360" height="600"></canvas><div id="hd"><span id="hm"></span><span id="hc"></span></div><div id="pw"></div><div id="bn"></div><div id="tip">← → carril · ↑ salto · ↓ deslizar</div></div>

</div>
</div>

<script>
const $=s=>document.querySelector(s),W=360,H=600,GY=470,PX=80;

{n:'Kai',a:1,sk:'#d99a73',hr:'#c9ccd6',jk:'#ff2bd6',jc:'#3b1a3c',pc:'#1c1626',hs:1,w:.88,gl:'桜'},
{n:'Lux',a:2,sk:'#f1c9a5',hr:'#ff6fae',jk:'#ffd24a',jc:'#3a3015',pc:'#241c14',hs:2,w:.94,gl:'光'}];
const OU=[{n:'Sin extra',a:0},{n:'Visor',a:1},{n:'Gorra',a:1},{n:'Gabardina',a:2},{n:'Máscara',a:3}];
let S={lives:3,best:0,yen:0,bs:0,bo:0,gift:0,mu:false,ch:0,ou:0,oc:[0],oo:[0],ads:{},m:[{n:'Recoge monedas',t:20,p:0},{n:'Corre metros en una partida',t:300,p:0,mx:1},{n:'Juega partidas',t:3,p:0}]};
try{Object.assign(S,JSON.parse(localStorage.getItem('nr1')||'{}'))}catch(e){}

/* Anuncio recompensado SIMULADO: aquí se conecta el SDK real (AdSense for Games, AdMob, etc.) */
function showAd(cb){
 const o=$('#ad'),b=$('#adx');let t=5;o.classList.add('on');b.disabled=true;$('#adt').textContent=t;
 const iv=setInterval(()=>{t--;$('#adt').textContent=t>0?t:'';if(t<=0){clearInterval(iv);b.disabled=false}},1000);
 b.onclick=()=>{o.classList.remove('on');cb()};
}
const addLife=n=>{S.lives=Math.min(9,S.lives+n);save()};

/* ---- Personaje 3D ---- */
const T=THREE,_g={},NC=['#ff2bd6','#19f3ff','#ffd24a','#ff4d4d','#7dff6b'];
const mk=(g,m,x,y,z)=>{const o=new T.Mesh(g,m);o.position.set(x||0,y||0,z||0);return o};
const BX=(w,h,d)=>{const k=w+'_'+h+'_'+d;if(!_g[k]){_g[k]=new T.BoxGeometry(w,h,d);_g[k].__shared=true}return _g[k]};
const LM=(c,e)=>new T.MeshLambertMaterial({color:c,emissive:e||'#000000'}),BM=(c,o)=>new T.MeshBasicMaterial(Object.assign({color:c},o||{}));
const rnd=(a,b)=>a+Math.random()*(b-a);
const SM=(c,r,m)=>new T.MeshStandardMaterial({color:c,roughness:r==null?.6:r,metalness:m||0});
function limb(len,r1,r2,m){const g=new T.Group();g.add(mk(new T.CylinderGeometry(r1,r2,len,10),m,0,-len/2,0));return g}
function glyph(ch){return ch.gt||(ch.gt=cvt(64,64,(x,w,h)=>{x.fillStyle=ch.jk;x.shadowColor=ch.jk;x.shadowBlur=8;x.font='700 46px '+JP;x.textAlign='center';x.textBaseline='middle';x.fillText(ch.gl,32,34)}))}
function makeChar(ch,ou){
 const k=ch.w,sk=SM(ch.sk,.7),hr=SM(ch.hr,.4,.1),jk=SM(ch.jc,.5,.1),pt=SM(ch.pc,.8),ac=BM(ch.jk),wh=SM('#f2f2fa',.4),dk=SM('#0e0b1a',.6),
  R=new T.Group(),b=new T.Group(),sp=new T.Group(),P={R,L:[],A:[],sp,body:b};
 const Sp=(r,m,x,y,z,sx,sy,sz)=>{const o=mk(new T.SphereGeometry(r,12,9),m,x,y,z);o.scale.set(sx||1,sy||1,sz||1);return o};
 R.add(b);sp.position.y=.02;b.add(sp);
 const to=mk(new T.CylinderGeometry(.23,.19,.62,18),jk,0,.35,0);to.scale.set(k,1,.62);
 const hem=mk(new T.TorusGeometry(.19,.025,6,20),dk,0,.05,0);hem.rotation.x=1.57;hem.scale.set(k,.62,1);
 const col=mk(new T.TorusGeometry(.085,.03,6,14),dk,0,.68,0);col.rotation.x=1.57;
 sp.add(to,hem,col,Sp(.085,jk,-.26*k,.6,0),Sp(.085,jk,.26*k,.6,0),mk(new T.CylinderGeometry(.05,.06,.1,10),sk,0,.71,0),mk(BX(.035,.58,.02),ac,0,.35,-.145),Sp(.14,jk,0,.7,.1,1.2,.75,.6));
 if(ou!=3)sp.add(mk(BX(.32,.42,.15),SM('#1a1530'),0,.38,.22),mk(BX(.28,.02,.01),ac,0,.54,.298),mk(BX(.05,.03,.3),SM('#1a1530'),-.15,.62,.08),mk(BX(.05,.03,.3),SM('#1a1530'),.15,.62,.08),
  mk(new T.PlaneGeometry(.17,.17),BM('#ffffff',{map:glyph(ch),transparent:true,depthWrite:false}),0,.38,.3));
 const hd=new T.Group();hd.position.set(0,.88,0);sp.add(hd);
 hd.add(Sp(.13,sk,0,0,0,.92,1.06,1),Sp(.075,sk,0,-.075,-.03,1,.8,1),Sp(.016,sk,0,-.015,-.13,1,1,.9),mk(BX(.04,.007,.01),SM('#8a3b45'),0,-.06,-.117));
 for(const q of[-1,1])hd.add(Sp(.025,sk,q*.12,-.01,0,.5,1,.8),Sp(.022,wh,q*.05,.015,-.108,1,.9,.5),Sp(.012,dk,q*.05,.015,-.119,1,1,.5),mk(BX(.05,.008,.01),hr,q*.05,.055,-.115));
 const cap=(r,tl)=>{const o=mk(new T.SphereGeometry(r,16,10,0,6.3,0,tl),hr,0,.012,.008);o.scale.set(.95,1.06,1);return o};
 if(ch.hs==0){hd.add(cap(.138,1.55));
  for(let i=0;i<8;i++){const a=i/8*6.28,c=mk(new T.ConeGeometry(.035,.12,5),hr,Math.sin(a)*.09,.12,Math.cos(a)*.09);c.rotation.set(Math.cos(a)*.6,0,-Math.sin(a)*.6);hd.add(c)}
  hd.add(mk(new T.TorusGeometry(.15,.012,6,20,Math.PI),dk));
  for(const q of[-1,1]){const c=mk(new T.CylinderGeometry(.045,.045,.03,12),dk,q*.145,-.01,0);c.rotation.z=1.57;const r=mk(new T.CylinderGeometry(.03,.03,.034,12),ac,q*.146,-.01,0);r.rotation.z=1.57;hd.add(c,r)}}
 else if(ch.hs==1){const bk=mk(new T.SphereGeometry(.152,16,12,0,Math.PI,0,2.5),hr,0,-.03,.008);bk.scale.set(.95,1.06,1);const f=mk(BX(.19,.05,.06),hr,0,.085,-.105);f.rotation.x=.3;hd.add(cap(.138,1.2),bk,f)}
 else{const bk=mk(new T.SphereGeometry(.15,16,12,0,Math.PI,0,1.7),hr,0,.0,.008),f=mk(BX(.19,.045,.06),hr,0,.09,-.105);f.rotation.x=.3;
  const pn=new T.Group();pn.position.set(0,.1,.12);const t=mk(new T.CylinderGeometry(.05,.015,.42,8),hr,0,-.21,0);pn.add(t,Sp(.045,hr,0,0,0),mk(new T.TorusGeometry(.04,.01,6,12),ac,0,-.02,0));pn.rotation.x=.5;hd.add(cap(.138,1.5),bk,f,pn);P.pn=pn}
 if(ou==1){const r=mk(new T.TorusGeometry(.135,.02,6,18),ac,0,.03,0);r.rotation.x=1.57;hd.add(r,mk(BX(.22,.06,.04),ac,0,.03,-.13))}
 if(ou==2)hd.add(mk(new T.SphereGeometry(.15,12,8,0,6.3,0,1.45),SM('#14102a'),0,.03,0),mk(BX(.2,.02,.17),SM('#14102a'),0,.02,-.17),mk(BX(.1,.03,.02),ac,0,.1,.14));
 if(ou==3){const c=new T.Group();c.position.set(0,.1,.15);c.add(mk(BX(.5,.75,.04),SM('#241a44'),0,-.35,.03),mk(BX(.5,.02,.05),ac,0,-.72,.03));sp.add(c);P.coat=c}
 if(ou==4){const m=Sp(.11,SM('#f4f1ff'),0,.02,.13,1,1.1,.35);hd.add(m);for(const q of[-.06,.06])hd.add(mk(new T.ConeGeometry(.05,.12,4),SM('#f4f1ff'),q,.16,.12));
  hd.add(mk(BX(.1,.012,.01),BM('#e0242f'),0,.0,.155),mk(BX(.012,.1,.01),BM('#e0242f'),0,.03,.156))}
 for(const q of[-1,1]){
  const u=limb(.48,.1,.075,pt),l=limb(.46,.07,.052,pt);u.position.set(q*.12*k,0,0);l.position.y=-.48;
  u.add(l,Sp(.078,pt,0,-.48,0),mk(BX(.03,.15,.1),dk,q*.095,-.2,0));
  l.add(mk(BX(.13,.04,.31),wh,0,-.5,-.06),mk(BX(.132,.012,.31),ac,0,-.512,-.06),Sp(.07,wh,0,-.47,-.1,1,.75,1.7),mk(BX(.006,.03,.14),ac,q*.066,-.47,-.08),mk(new T.CylinderGeometry(.062,.056,.04,10),dk,0,-.43,0));
  b.add(u);P.L.push({u,l});
  const a=limb(.3,.07,.058,jk),f=limb(.28,.056,.045,jk);a.position.set(q*.27*k,.6,0);f.position.y=-.3;a.add(f,Sp(.062,jk,0,-.3,0));
  f.add(Sp(.05,sk,0,-.3,0),mk(new T.CylinderGeometry(.052,.052,.035,10),ac,0,-.24,0));sp.add(a);P.A.push({u:a,l:f})}
 return P}
function pose(P,t,m){
 const ph=t*13,s=Math.sin,c=Math.cos;let L,K,A,E=1.3;
 if(m==1){L=[.9,-.5];K=[1.1,.8];A=[2.3,-1.2];E=.5}
 else if(m==2){L=[.1,.05];K=[.05,.05];A=[1.2,1.2];E=.2}
 else{L=[s(ph)*.95,s(ph+3.14)*.95];K=[Math.max(.15,c(ph)*.8+.7),Math.max(.15,c(ph+3.14)*.8+.7)];A=[-L[0]*.9,-L[1]*.9]}
 P.L.forEach((l,i)=>{l.u.rotation.x=L[i];l.l.rotation.x=-K[i]});
 P.A.forEach((a,i)=>{a.u.rotation.x=A[i];a.l.rotation.x=E});
 P.body.rotation.x=m==2?1.3:-.12;P.body.position.y=m==2?.34:1.0+(m==0?Math.abs(s(ph))*.05:0);P.sp.rotation.y=m==0?s(ph)*.18:0;
 if(P.coat)P.coat.rotation.x=-(.2+s(ph*.9)*.12+(m==1?.4:0));
 if(P.pn)P.pn.rotation.x=.5+s(ph)*.2+(m==1?.4:0)}
const free=P=>P.R.traverse(m=>{m.geometry&&!m.geometry.__shared&&m.geometry.dispose();m.material&&(Array.isArray(m.material)?m.material:[m.material]).forEach(x=>x&&!x.__shared&&x.dispose())});
let PR;
function pv(cv,ch,ou){
 if(!PR){PR=new T.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});PR.setSize(120,160);PR.sc=new T.Scene();
  PR.sc.add(new T.HemisphereLight('#ffffff','#443366',1.1));const d=new T.DirectionalLight('#ffffff',.7);d.position.set(2,4,4);PR.sc.add(d);
  const d2=new T.DirectionalLight('#ff2bd6',.9);d2.position.set(-3,2,-3);PR.sc.add(d2);
  PR.cam=new T.PerspectiveCamera(30,.75,.1,50);PR.cam.position.set(0,1.05,5.2);PR.cam.lookAt(0,1,0)}
 const P=makeChar(ch,ou);P.R.rotation.y=Math.PI-.55;pose(P,.3,0);PR.sc.add(P.R);PR.render(PR.sc,PR.cam);PR.sc.remove(P.R);free(P);
 const x=cv.getContext('2d');x.clearRect(0,0,120,160);x.drawImage(PR.domElement,0,0)}

/* ---- Menú ---- */
function render(){
 $('#hud').textContent='❤ '+S.lives+'  ·  ¥ '+S.yen;
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 const B=$('#body');let h='';
 if(tab=='play'){
  const lv=Math.floor(Math.sqrt(S.yen/25))+1,b0=25*(lv-1)*(lv-1),b1=25*lv*lv,RK=['Novato','Corredor','Callejero','Neón','Samurái','Leyenda'][Math.min(5,Math.floor((lv-1)/3))],rd=Date.now()-S.gift>864e5;
  h=`<div class="card"><p class="big">${RK} · Nivel ${lv}</p><div class="bar"><i style="width:${(S.yen-b0)/(b1-b0)*100}%"></i></div><p class="mu">¥ ${S.yen} · Récord: ${S.bs} puntos · ${S.best} m</p></div>
  <div class="card"><p class="mu">Cada partida cuesta 1 vida. Desliza ← → para cambiar de carril, ↑ para saltar (doble salto) y ↓ para deslizarte. Pisa un trampolín o haz doble salto para subir a los tejados. Recoge escudo, imán y x2.</p>
  <button class="btn" data-a="play" ${S.lives<1?'disabled':''}>Jugar (−1 ❤)</button>
  <button class="btn g" data-a="boost" ${S.bo?'disabled':''}>${S.bo?'Impulso listo: escudo e imán':'Anuncio: empezar con escudo e imán'}</button>
  <button class="btn m" data-a="life">Ver anuncio: +1 ❤</button>
  <button class="btn g" data-a="gift" ${rd?'':'disabled'}>${rd?'Regalo diario: +2 ❤ (anuncio)':'Regalo diario ya reclamado'}</button>
  <button class="btn g" data-a="mute">Sonido: ${S.mu?'apagado':'encendido'}</button></div>`;
 }else if(tab=='skins'){
  const blk=(L,own,sel,k,title)=>`<p class="big" style="font-size:16px">${title}</p><div class="grid">`+L.map((o,i)=>{
   const has=own.includes(i),need=o.a,got=S.ads[k+i]||0;
   return `<div class="it ${sel==i?'eq':''}"><canvas data-k="${k}" data-i="${i}" width="120" height="160"></canvas><div>${o.n}</div>`+
   (has?`<button class="${sel==i?'d':''}" data-a="eq" data-k="${k}" data-i="${i}">${sel==i?'Puesto':'Usar'}</button>`:`<button data-a="unl" data-k="${k}" data-i="${i}">Anuncio ${got}/${need}</button>`)+`</div>`}).join('')+`</div>`;
  h=blk(CH,S.oc,S.ch,'c','Personajes')+blk(OU,S.oo,S.ou,'o','Ropa');
 }else{
  h=S.m.map((m,i)=>{const ok=m.p>=m.t;return `<div class="card"><p class="big" style="font-size:16px">${m.n}</p><p class="mu">${Math.min(m.p,m.t)} / ${m.t}</p><div class="bar"><i style="width:${Math.min(100,m.p/m.t*100)}%"></i></div>
  <button class="btn g" data-a="claim" data-i="${i}" data-x="1" ${ok?'':'disabled'}>Reclamar +1 ❤</button>
  <button class="btn m" data-a="claim" data-i="${i}" data-x="2" ${ok?'':'disabled'}>Reclamar +2 ❤ con anuncio</button></div>`}).join('');
 }
 B.innerHTML=h;
 B.querySelectorAll('canvas').forEach(e=>{try{const k=e.dataset.k,i=+e.dataset.i;pv(e,k=='c'?CH[i]:CH[S.ch],k=='c'?S.ou:i)}catch(z){console.error(z)}});
}
$('.tabs').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;render()}};
$('#body').onclick=e=>{
 const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,i=+b.dataset.i,k=b.dataset.k;
 if(a=='play')start();else if(a=='boost')showAd(()=>{S.bo=1;save();render()});else if(a=='gift')showAd(()=>{S.gift=Date.now();addLife(2);render()});else if(a=='mute'){S.mu=!S.mu;save();music(0);render()}
 else if(a=='life')showAd(()=>{addLife(1);render()});
 else if(a=='eq'){if(k=='c')S.ch=i;else S.ou=i;save();render()}
 else if(a=='unl')showAd(()=>{const key=k+i,L=k=='c'?CH:OU;S.ads[key]=(S.ads[key]||0)+1;
   if(S.ads[key]>=L[i].a)(k=='c'?S.oc:S.oo).push(i);save();render()});
 else if(a=='claim'){const m=S.m[i],x=+b.dataset.x,go=()=>{addLife(x);m.t=Math.round(m.t*1.8);m.p=0;save();render()};x==2?showAd(go):go()}
};
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id==id))}

/* ---- Juego 3D ---- */
const cv=$('#cv'),LW=2.2,NS=4,SL=60,JP='"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif';
let BUB,PL,SH,G=null,last=0,raf=0,ren,sc,cam,pl,seg=[],rain,RM,HT,FT=[],ST=[];
